name: release

# Runs only for version tags (v*) and manual dry runs. A dry run (workflow_dispatch) runs the
# checks, builds and smoke-tests the packages and the container image and uploads the packages as
# workflow artifacts; only a tag push pushes the image to GHCR and creates the GitHub Release.
# Every architecture (amd64, arm64) is built, packaged and smoke-tested on a native runner; the
# published tags point to one multi-arch index assembled from the per-architecture images.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: Optional existing image tag to check an upgrade (for example 0.1.0)
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The rebuilt v0.1.0 is intentionally a prerelease despite its plain version tag.
  RELEASE_PRERELEASE: ${{ github.ref_name == 'v0.1.0' || contains(github.ref_name, '-') }}

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  package:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (rust-toolchain.toml) + musl target
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build and package
        run: scripts/package.sh
      - name: Smoke test the .deb under systemd
        run: scripts/deb-smoke.sh dist/ciallopa_*_${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v7
        with:
          name: ciallopa-packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  docker:
    needs: package
    strategy:
      # Keep evidence from both architectures when one smoke test fails.
      # docker-publish still requires the entire matrix to succeed.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ciallopa-packages-${{ matrix.arch }}
          path: dist
      - name: Build context from the release tar.gz
        id: ctx
        run: |
          mkdir ctx
          tar -xzf dist/ciallopa-*-"$TARGET".tar.gz -C ctx --strip-components=1
          ls -l ctx
          version=$(ctx/ciallopa --version | awk '{ print $2 }')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ctx.outputs.image }}
          labels: |
            org.opencontainers.image.title=ciallopa
            org.opencontainers.image.description=Lightweight AI gateway
            org.opencontainers.image.version=${{ steps.ctx.outputs.version }}
      - name: Build image (local)
        id: smoke
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: packaging/docker/Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: ciallopa:smoke
          build-args: |
            VERSION=${{ steps.ctx.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.ctx.outputs.source_date_epoch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Smoke test the image
        run: scripts/docker-smoke.sh ciallopa:smoke
      - name: Compose recovery and active SSE/WS shutdown
        env:
          # Older published images are amd64-only, so the upgrade check runs on amd64.
          UPGRADE_FROM: ${{ matrix.arch == 'amd64' && inputs.upgrade_from || '' }}
          IMAGE: ${{ steps.ctx.outputs.image }}
        run: |
          args=()
          if [[ -n "$UPGRADE_FROM" ]]; then
            # Only a tag of this repository's package can be selected.
            [[ "$UPGRADE_FROM" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
            docker pull --platform "$PLATFORM" "$IMAGE:$UPGRADE_FROM"
            args+=(--upgrade-from "$IMAGE:$UPGRADE_FROM")
          fi
          python3 scripts/compose-smoke.py ciallopa:smoke "${args[@]}"
      - name: Keep Compose smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ciallopa-compose-smoke-${{ matrix.arch }}
          # Only synthetic fixture metadata/logs, not the large saved image archive.
          path: /tmp/ciallopa-compose-smoke-*/result.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload image by digest
        id: upload
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: packaging/docker/Dockerfile
          platforms: ${{ env.PLATFORM }}
          # Untagged until docker-publish has compared it with the smoke-tested image.
          outputs: type=image,name=${{ steps.ctx.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.ctx.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.ctx.outputs.source_date_epoch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry pushes retain attestations; the local smoke image above omits them
          # because the default Docker image store cannot load attestation manifests.
          provenance: mode=min
          sbom: true
      - name: Verify the uploaded image matches the smoke-tested image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          SMOKE_METADATA: ${{ steps.smoke.outputs.metadata }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.digest }}
          IMAGE: ${{ steps.ctx.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Config digests cover runtime config + filesystem layer IDs. Attestations change
          # the registry index digest, so comparing the top-level image IDs is insufficient.
          digest_filter='."containerimage.config.digest" | select(type == "string") | select(test("^sha256:[0-9a-f]{64}$"))'
          smoke_config=$(jq -er "$digest_filter" <<< "$SMOKE_METADATA")
          loaded_config=$(docker image inspect --format '{{.Id}}' ciallopa:smoke)
          [[ "$UPLOAD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Attested exports return an index without containerimage.config.digest.
          # Resolve the single runnable manifest of this architecture from the uploaded index.
          uploaded_index=$(docker buildx imagetools inspect --raw "$IMAGE@$UPLOAD_DIGEST")
          runtime_digest=$(jq -er --arg arch "$ARCH" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
            | if length == 1 then .[0].digest else error("expected one linux/\($arch) image") end
            | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$uploaded_index")
          runtime_manifest=$(docker buildx imagetools inspect --raw "$IMAGE@$runtime_digest")
          upload_config=$(jq -er '.config.digest | select(type == "string")
            | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$runtime_manifest")
          if [[ "$smoke_config" != "$upload_config" || "$smoke_config" != "$loaded_config" ]]; then
            echo '::error::The uploaded runtime image differs from the smoke-tested image'
            exit 1
          fi
          mkdir -p digests
          jq -n --arg index "$UPLOAD_DIGEST" --arg runtime "$runtime_digest" \
            '{index: $index, runtime: $runtime}' > "digests/$ARCH.json"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: ciallopa-image-digest-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          retention-days: 7

  docker-publish:
    needs: docker
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ciallopa-image-digest-*
          path: digests
          merge-multiple: true
      - name: Image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.RELEASE_PRERELEASE != 'true' }}
            type=raw,value=latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          image=$IMAGE
          sources=()
          declare -A runtime
          for arch in amd64 arm64; do
            index=$(jq -er '.index | select(test("^sha256:[0-9a-f]{64}$"))' "digests/$arch.json")
            runtime[$arch]=$(jq -er '.runtime | select(test("^sha256:[0-9a-f]{64}$"))' "digests/$arch.json")
            sources+=("$image@$index")
          done
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          (( ${#tags[@]} > 0 ))
          # Merges both attested indexes: one runnable image per platform plus their attestations.
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          # Every published tag must resolve to exactly the verified per-arch runtime images.
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            published=$(docker buildx imagetools inspect --raw "$tag")
            for arch in amd64 arm64; do
              jq -e --arg arch "$arch" --arg digest "${runtime[$arch]}" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)]
                | length == 1 and .[0].digest == $digest' <<< "$published" > /dev/null ||
                { echo "::error::$tag does not hold the verified linux/$arch image"; exit 1; }
            done
            echo "$tag: $(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}')"
          done <<< "$IMAGE_TAGS"

  release:
    needs: [package, docker-publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ciallopa-packages-*
          path: packages
      - name: Collect assets and one SHA256SUMS for all of them
        run: |
          mkdir dist
          for dir in packages/ciallopa-packages-*/; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
            find "$dir" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec mv -n -t dist {} +
          done
          (cd dist && sha256sum -- *.tar.gz *.deb > SHA256SUMS && cat SHA256SUMS)
          # Two architectures: a tar.gz and a .deb each.
          test "$(find dist -type f | wc -l)" -eq 5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ciallopa ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md \
            --verify-tag "${release_flags[@]}"
