# ciallopa with Docker Compose. Next to this file:
#   config/   config.toml (created by `docker compose run --rm ciallopa init`), .bak, audit log
#   data/     accounts (auths/), usage.db, client_fingerprint.json
# Create both as the user named in `user:` below, then:
#   docker compose run --rm ciallopa init
#   docker compose up -d
#   docker compose exec ciallopa ciallopa login
# Deployment, backups and image updates: ../../docs/DEPLOYMENT.md
services:
  ciallopa:
    image: ghcr.io/seia-yurizono/ciallopa:0.4.0
    # Run as your own account so config/ and data/ stay editable without sudo: put the output
    # of `id -u`:`id -g` here. Without `user:` the image runs as uid 65532, and both
    # directories must then belong to 65532 (sudo install -d -o 65532 -g 65532 -m 700 config data).
    user: "1000:1000"
    # Stable name: instance_id in usage records defaults to the hostname.
    hostname: ciallopa
    restart: unless-stopped
    ports:
      # Loopback only: a reverse proxy on the host (or an SSH tunnel) reaches 127.0.0.1:8317.
      - "127.0.0.1:8317:8317"
    volumes:
      # The directory, not the file: settings are saved by writing a temporary file and
      # renaming it over config.toml (with config.toml.bak and config.toml.audit.jsonl beside it).
      # Fail if a directory is missing, instead of creating it with root ownership.
      - type: bind
        source: ./config
        target: /etc/ciallopa
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /var/lib/ciallopa/.ciallopa
        bind:
          create_host_path: false
    # Budget: shutdown_drain_secs (default 5 s) for running responses, then up to 3 s close,
    # 5 s usage flush and 2 s runtime shutdown = 15 s. Cut turns get a retryable error and Codex
    # replays them after the restart. If you raise shutdown_drain_secs, keep this >= drain + 15 s.
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
