listen = "127.0.0.1:8317"
# Plain strings may only forward requests; the management API (/admin/v1/*, /ui/settings,
# /ui/accounts, reset-credit consume) needs a table entry with admin = true.
api_keys = [{ label = "laptop", key = "sk-cpa-change-me-0123456789", admin = true }]
upstream = "https://chatgpt.com/backend-api"
auth_dir = "~/.ciallopa/auths"
proxy_url = ""

[routing]
strategy = "round-robin"
session_affinity = true
session_affinity_ttl = "1h"
session_affinity_subagents = true
session_affinity_rebind_on = "quota"
quota_avoid_threshold = 0.0   # 0 = off (default); error-driven cooldown + switch only. e.g. 0.95 to also avoid near-full accounts for new sessions

[usage]
enabled = true
path = "~/.ciallopa/usage.db"
retention_days = 90   # default 90; 0 = keep forever (requests + error details)

[ui]
enabled = true
reset_credits_refresh_mins = 60   # read-only listing refresh; 0 = on demand only
allow_reset_consume = false       # true = allow manually spending a 重置卡 (irreversible)
allow_config_write = false        # true = allow settings / key / account changes from /ui/settings and /ui/accounts (file only)

[upstream_opts]
# Upstream 5xx: switch to another usable account (the client retries the same one). An account is
# cooled only after 3 consecutive 5xx, for this many seconds (upstream Retry-After wins, max 60).
# 0 = never cool.
transient_cooldown_secs = 15
# Overloaded / "at capacity" (in-stream or HTTP): replayed on another usable account while nothing
# has reached the client. After this many consecutive ones an account is cooled for
# overload_cooldown_secs, doubling per further cooldown up to overload_cooldown_max_secs; output
# resets it. The last usable account is never cooled. overload_streak = 0 = never cool.
overload_streak = 2
overload_cooldown_secs = 120
overload_cooldown_max_secs = 600
# No other usable account and nothing sent yet: wait about this long (2/3–5/3 jitter; upstream
# Retry-After honored up to 10 s) and retry once on the same account. 0 = off.
overload_retry_wait_secs = 3
# Per-account in-memory jar for ChatGPT infrastructure cookies (Cloudflare + __oailb only,
# official Codex allowlist; https ChatGPT hosts only; never shared across accounts).
# Client Cookie headers are never forwarded upstream and upstream Set-Cookie never reaches clients.
cloudflare_cookies = false
